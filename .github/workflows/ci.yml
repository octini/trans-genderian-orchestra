name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: plugin
      - run: bunx tsc --noEmit
        working-directory: plugin
      - run: bun run src/build.ts
        working-directory: plugin
      - run: test $(grep -c "slots.register" plugin/dist/server.js) -eq 0
      - run: test $(grep -c "experimental.chat" plugin/dist/tui.js) -eq 0
